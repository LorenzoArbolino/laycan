[project]
name = "laycan-calibration"
version = "0.1.0"
description = "Offline calibration: public data -> engine parameters with provenance"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "searoute>=1.3",
  "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
